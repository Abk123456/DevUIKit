    <style>
        .ftx-container {
            position: absolute;
            width: 330px;
            background: #1e222b;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 6px 10px;
            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.25),
                0 2px 6px rgba(0, 0, 0, 0.15);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 50;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background-color 0.2s ease;
        }

        .ftx-container:focus-within {
            background: #232833;
            border-color: rgba(16, 185, 129, 0.8);
            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.3),
                0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .ftx-container .ftx-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .ftx-container .ftx-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #f3f4f6;
            font-size: 13px;
            padding: 16px 105px 4px 4px;
            line-height: 1.4;
        }

        .ftx-container .ftx-label {
            position: absolute;
            left: 4px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 13px;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ftx-container.ftx-active .ftx-label,
        .ftx-container .ftx-input:focus ~ .ftx-label {
            top: 6px;
            transform: translateY(0);
            font-size: 10px;
            color: #34d399;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .ftx-container .ftx-actions {
            position: absolute;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ftx-container .ftx-clear {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #9ca3af;
            font-size: 15px;
            cursor: pointer;
            width: 22px;
            height: 22px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .ftx-container .ftx-clear.ftx-visible {
            display: flex;
        }

        .ftx-container .ftx-clear:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .ftx-container .ftx-verify {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ftx-container .ftx-verify:hover {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
            transform: translateY(-1px);
        }

        .ftx-container .ftx-verify:active {
            transform: translateY(0) scale(0.97);
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
        }

        .ftx-container .ftx-verify-icon {
            stroke: #ffffff;
            opacity: 0.9;
        }
    </style>

    <div class="ftx-wrapper">
        <input type="text"
               id="ftxInput"
               class="ftx-input"
               placeholder=" "
               aria-labelledby="ftxLabel" />

        <label class="ftx-label"
               id="ftxLabel"
               for="ftxInput">
            Enter value
        </label>

        <div class="ftx-actions">
            <button type="button"
                    class="ftx-clear"
                    id="ftxClear"
                    title="Clear"
                    aria-label="Clear input">
                ×
            </button>

            <button type="button"
                    class="ftx-verify"
                    id="ftxVerify"
                    title="Verify">
                <svg width="12"
                     height="12"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="3"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     class="ftx-verify-icon">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Verify
            </button>
        </div>
    </div>
</div>

<script>
    (function () {
        var container = document.getElementById("floatingTextbox");
        var input = document.getElementById("ftxInput");
        var clearButton = document.getElementById("ftxClear");
        var verifyButton = document.getElementById("ftxVerify");

        function updateState() {
            var hasValue = input.value.trim().length > 0;
            var isFocused = document.activeElement === input;

            container.classList.toggle("ftx-active", hasValue || isFocused);
            clearButton.classList.toggle("ftx-visible", hasValue);
        }

        input.addEventListener("input", updateState);
        input.addEventListener("focus", updateState);
        input.addEventListener("blur", updateState);

        clearButton.addEventListener("click", function () {
            input.value = "";
            input.focus();
            updateState();

            // Add your value-changed logic here.
            console.log("Cleared value:", input.value);
        });

        verifyButton.addEventListener("click", function () {
            // Add your verification logic here.
            console.log("Verify clicked. Value:", input.value);
        });

        updateState();
    })();
</script>

        <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete UI Component & Alert Library</title>
  <style>
    /* Container positioned at top-right */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 360px;
  width: 100%;
}

/* Floating Alert Card Base */
.toast {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  background-color: #ffffff;
  border-radius: 8px;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  border-left: 5px solid #cbd5e1;
  color: #1e293b;
  font-family: system-ui, -apple-system, sans-serif;
  animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

/* Exit Animation Class */
.toast.hide {
  opacity: 0;
  transform: translateX(100%);
}

/* Icon Container */
.toast-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  margin-top: 2px;
}

.toast-icon svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

/* Content Area */
.toast-content {
  flex-grow: 1;
}

.toast-title {
  font-size: 0.95rem;
  font-weight: 600;
  margin: 0 0 2px 0;
  line-height: 1.3;
}

.toast-description {
  font-size: 0.85rem;
  color: #64748b;
  margin: 0;
  line-height: 1.4;
}

/* Close Button */
.toast-close {
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 1.25rem;
  cursor: pointer;
  line-height: 1;
  padding: 0;
  margin-left: 4px;
}

.toast-close:hover {
  color: #475569;
}

/* Theme Variant Colors */
.toast-success {
  border-left-color: #10b981;
}
.toast-success .toast-icon {
  color: #10b981;
}

.toast-error {
  border-left-color: #ef4444;
}
.toast-error .toast-icon {
  color: #ef4444;
}

.toast-warning {
  border-left-color: #f59e0b;
}
.toast-warning .toast-icon {
  color: #f59e0b;
}

.toast-info {
  border-left-color: #3b82f6;
}
.toast-info .toast-icon {
  color: #3b82f6;
}

/* Slide In Animation */
@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(100%);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* Demo Button Styling */
.button-group {
  display: flex;
  gap: 10px;
  padding: 20px;
  font-family: system-ui, -apple-system, sans-serif;
}

.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  color: #fff;
  cursor: pointer;
  font-weight: 500;
}

.btn-success { background-color: #10b981; }
.btn-error { background-color: #ef4444; }
.btn-warning { background-color: #f59e0b; }
.btn-info { background-color: #3b82f6; }

  </style>
</head>
<body>

  <!-- Container to stack floating alerts -->
<div class="toast-container" id="toastContainer"></div>

<!-- Example Buttons to Trigger Alerts -->
<div class="button-group">
  <button class="btn btn-success" onclick="showAlert('success', 'Success!', 'Your changes have been saved successfully.')">Success Alert</button>
  <button class="btn btn-error" onclick="showAlert('error', 'Error Occurred', 'Failed to connect to the server. Please try again.')">Error Alert</button>
  <button class="btn btn-warning" onclick="showAlert('warning', 'Warning', 'Your storage space is running low.')">Warning Alert</button>
  <button class="btn btn-info" onclick="showAlert('info', 'Information', 'A new software update is available.')">Info Alert</button>
</div>

 

 <script>
   // Inline SVG Icons mapped by type
const alertIcons = {
  success: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`,
  error: `<svg viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>`,
  warning: `<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>`,
  info: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>`
};

/**
 * Reusable Alert Function
 * @param {('success'|'error'|'warning'|'info')} type 
 * @param {string} title 
 * @param {string} description 
 * @param {number} duration - Auto-close delay in ms (default: 4000)
 */

function showAlert(type, title, description, duration = 4000) {
  const container = document.getElementById('toastContainer');

  // Create Toast Element
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;

  // Fill Inner Content
  toast.innerHTML = `
    <div class="toast-icon">${alertIcons[type] || alertIcons.info}</div>
    <div class="toast-content">
      <div class="toast-title">${title}</div>
      <div class="toast-description">${description}</div>
    </div>
    <button class="toast-close" type="button">&times;</button>
  `;

  // Append to container
  container.appendChild(toast);

  let isRemoved = false;

  // Close Function with exit animation
  const removeToast = () => {
    if (isRemoved) return;
    isRemoved = true;

    toast.classList.add('hide');
    
    // Fallback timer matching CSS transition duration (0.3s)
    setTimeout(() => {
      toast.remove();
    }, 300);
  };

  // Auto Dismiss Timer
  let autoTimer = setTimeout(removeToast, duration);

  // Close on button click
  const closeBtn = toast.querySelector('.toast-close');
  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clearTimeout(autoTimer); // Clear the auto-dismiss timer so they don't clash
    removeToast();
  });

  // Optional: Pause auto-dismiss on hover
  toast.addEventListener('mouseenter', () => clearTimeout(autoTimer));
  toast.addEventListener('mouseleave', () => {
    if (!isRemoved) {
      autoTimer = setTimeout(removeToast, duration);
    }
  });
}
  </script>
</body>
